name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-24.04
    env:
      # The suite fakes Whisper and Gemini. Offline mode makes any accidental
      # model download fail loudly instead of pulling gigabytes; no API key is set.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # Converts browser formats (webm, m4a) in the upload tests; they skip without it.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      # Tests needing models/classifier.joblib or licensed data skip; -rs lists them.
      - name: Run tests
        run: pytest -rs

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
